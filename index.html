<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Factură — Obsidian Innovations</title>
<meta name="theme-color" content="#16202b" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
  :root {
    --desk: #d9dee4;
    --paper: #ffffff;
    --ink: #16202b;
    --muted: #5d6b7a;
    --rule: #ccd4dc;
    --biro: #1b3fc4;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --pad: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--desk);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- top bar ---- */
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px var(--pad) 10px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--ink);
    color: #eef2f6;
    border-bottom: 3px solid var(--biro);
  }
  .bar__mark {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #9fb0c2;
    padding-right: 12px;
    border-right: 1px solid #33465a;
  }
  .bar__meta {
    font-family: var(--mono);
    font-size: 12px;
    color: #9fb0c2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar__total {
    margin-left: auto;
    text-align: right;
    line-height: 1.15;
    white-space: nowrap;
  }
  .bar__total b {
    display: block;
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .bar__total span {
    font-family: var(--mono);
    font-size: 11px;
    color: #9fb0c2;
  }

  /* ---- layout ---- */
  .wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 480px);
    gap: var(--pad);
    padding: var(--pad);
    align-items: start;
  }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
    .pane { display: none; }
  }

  /* ---- cards ---- */
  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 14px 16px 16px;
    margin-bottom: 14px;
  }
  .card__head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  .card__head h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .card__note { font-size: 12px; color: var(--muted); }
  .card__head .btn { margin-left: auto; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
  }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field--wide { grid-column: 1 / -1; }
  .field__label {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field__hint { font-size: 11.5px; color: var(--muted); }

  input {
    font: inherit;
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--ink);
    background: #fbfcfd;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 7px 8px;
    width: 100%;
    min-width: 0;
  }
  input:focus-visible {
    outline: 2px solid var(--biro);
    outline-offset: 1px;
    background: #fff;
  }

  /* ---- product lines ---- */
  .line {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 90px 110px 32px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .line--head {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  @media (max-width: 560px) {
    .line { grid-template-columns: minmax(0, 1fr) 70px 84px 30px; }
  }

  /* ---- buttons ---- */
  .btn {
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 2px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: #24374b; }
  .btn--ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  .btn--ghost:hover { background: #eef2f6; border-color: var(--ink); }
  .btn--icon {
    padding: 6px 0;
    line-height: 1;
    font-size: 18px;
    background: transparent;
    color: var(--muted);
    border-color: transparent;
  }
  .btn--icon:hover { background: #f2d7db; color: #8d1f2f; }
  .btn--primary { background: var(--biro); border-color: var(--biro); }
  .btn--primary:hover { background: #16349f; }
  .btn:focus-visible { outline: 2px solid var(--biro); outline-offset: 2px; }

  .actions {
    position: sticky;
    bottom: 0;
    display: flex;
    gap: 10px;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--desk) 70%, transparent);
  }
  .actions .btn { flex: 1; padding: 12px; font-size: 14px; }

  .rate-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .status { margin: 0; font-size: 12px; color: var(--muted); flex: 1 1 200px; }

  /* ---- preview pane ---- */
  .pane { position: sticky; top: 76px; }
  .pane__label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  #preview {
    width: 100%;
    aspect-ratio: 210 / 297;
    border: 1px solid var(--rule);
    background: var(--paper);
    box-shadow: 0 6px 22px rgba(22, 32, 43, .16);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <header class="bar">
    <span class="bar__mark">Obsi</span>
    <span class="bar__meta" id="meta"></span>
    <span class="bar__total">
      <b id="total">—</b>
      <span id="total-ron"></span>
    </span>
  </header>

  <main class="wrap">
    <div>
      <div id="form"></div>
      <div class="actions">
        <button class="btn btn--primary" id="download" type="button">Descarcă PDF</button>
        <button class="btn btn--ghost" id="open" type="button">Deschide într-un tab</button>
      </div>
    </div>
    <aside class="pane">
      <p class="pane__label">Exact ce se descarcă</p>
      <iframe id="preview" title="Previzualizare factură"></iframe>
    </aside>
  </main>

  <script src="./app.js"></script>
</body>
</html>
